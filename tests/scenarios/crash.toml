name = "upgrade recovers data dirs from servers that crashed"

[[steps]]
run = "use-fixture mariadb-10.5-crash && mysql-multi-upgrade upgrade data"

[steps.expected]
stdout-contains = "Steps: mariadb-10.5 -> "

[[steps]]
run = "verify-as mariadb-11.8 mariadb-10.5-crash"

[steps.expected]
stdout-matches = "^verified with 11\\.8\\."

[[steps]]
run = "use-fixture mysql-5.7-crash mysql && mysql-multi-upgrade upgrade mysql"

[steps.expected]
stdout-contains = "Steps: mysql-5.7 -> mysql-8.0 -> mysql-8.4\n"

[[steps]]
run = "verify-as mysql-8.4 mysql-5.7-crash mysql"

[steps.expected]
stdout-matches = "^verified with 8\\.4\\."
