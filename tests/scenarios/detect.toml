name = "detect reads the version of data dirs from each server"

[[steps]]
run = "datadir-upgrade detect $FIXTURES/mariadb-10.3/data"

[steps.expected]
stdout-matches = "^mariadb 10\\.3\\.\\d+$"

[[steps]]
run = "datadir-upgrade detect $FIXTURES/mariadb-10.4/data"

[steps.expected]
stdout-matches = "^mariadb 10\\.4\\.\\d+$"

[[steps]]
run = "datadir-upgrade detect $FIXTURES/mariadb-10.5/data"

[steps.expected]
stdout-matches = "^mariadb 10\\.5\\.\\d+$"

[[steps]]
run = "datadir-upgrade detect $FIXTURES/mariadb-10.6/data"

[steps.expected]
stdout-matches = "^mariadb 10\\.6\\.\\d+$"

[[steps]]
