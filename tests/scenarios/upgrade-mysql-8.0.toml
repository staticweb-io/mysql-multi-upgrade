name = "upgrade takes a mysql-8.0 data dir to mysql-8.4"

[[steps]]
run = "use-fixture mysql-8.0"

[[steps]]
run = "mysql-multi-upgrade upgrade data"

[steps.expected]
# 8.0 already defaults to caching_sha2_password
stderr-not-contains = "Warning"
stdout-matches = "^Upgraded .*/data from mysql 8\\.0\\.\\d+ to mysql 8\\.4\\.\\d+$"

[[steps]]
run = "mysql-multi-upgrade detect data"

[steps.expected]
stdout-matches = "^mysql 8\\.4\\.\\d+$"

[[steps]]
run = "verify-as mysql-8.4 mysql-8.0"

[steps.expected]
stdout-matches = "^verified with 8\\.4\\.\\d+$"
